name: FoldReference
options:
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
packages:
  FoldGlass:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.6'
    CURRENT_PROJECT_VERSION: '8'
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  FoldReference:
    type: application
    platform: iOS
    sources: [Example]
    dependencies:
      - package: FoldGlass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyant.foldreference
        INFOPLIST_KEY_CFBundleDisplayName: 折页参照
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  FoldReferenceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FoldReference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyant.foldreference.uitests
        TEST_TARGET_NAME: FoldReference
schemes:
  FoldReference:
    build:
      targets:
        FoldReference: all
    test:
      targets: [FoldReferenceUITests]
