# Skip configuration for LiquidKit dual-platform SwiftUI -> Android Compose adapter.
# Publish the Android library locally first:
#   ./gradlew :backdrop:publishToMavenLocal :liquidkit:publishToMavenLocal
skip:
  mode: 'transpiled'
  bridging: true

settings:
  contents:
    - block: 'dependencyResolutionManagement'
      contents:
        - block: 'repositories'
          contents:
            - 'mavenLocal()'
            - 'google()'
            - 'mavenCentral()'

build:
  contents:
    - block: 'dependencies'
      contents:
        - 'implementation("io.liquidkit:liquidkit-android:1.0.0")'
        - 'implementation("io.github.kyant0:backdrop-android:2.0.1")'
        - 'implementation("org.jetbrains.compose.foundation:foundation:1.12.0")'
        - 'implementation("org.jetbrains.compose.animation:animation:1.12.0")'
        - 'implementation("io.github.kyant0:shapes:1.2.1")'
